<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rialles sense pietat · Halloween 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: #080604;
      color: #f5dfb1;
    }

    body {
      min-height: 100vh;

      background-image:
        linear-gradient(
          rgba(0,0,0,0.12),
          rgba(0,0,0,0.30)
        ),
        url("fondo.png");

      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }

    .pagina {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 18px 25px;
    }

    .cabecera {
      text-align: center;
      max-width: 650px;
      margin-bottom: 25px;
    }

    .cabecera h1 {
      margin: 0;

      font-size: clamp(34px, 8vw, 64px);
      line-height: 0.95;

      color: #e7ad49;

      text-transform: uppercase;
      letter-spacing: 2px;

      text-shadow:
        0 3px 3px #000,
        0 0 18px rgba(0,0,0,.9);
    }

    .cabecera .subtitulo {
      margin-top: 12px;
      font-size: 17px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f1d59a;
      text-shadow: 0 2px 5px #000;
    }

    .tarjeta {
      width: min(92vw, 520px);

      background:
        linear-gradient(
          rgba(15,10,7,.91),
          rgba(8,5,3,.95)
        );

      border: 1px solid #a66a28;
      border-radius: 12px;

      padding: 28px 24px;

      text-align: center;

      box-shadow:
        0 15px 45px rgba(0,0,0,.65),
        inset 0 0 30px rgba(126,72,23,.12);
    }

    .tarjeta h2 {
      margin: 0 0 10px;

      color: #e5b45c;

      font-size: 24px;
      font-weight: normal;
    }

    .instruccion {
      margin: 0 auto 22px;
      max-width: 400px;
      line-height: 1.5;
      color: #e7d6b7;
      font-size: 15px;
    }

    #codigo {
      width: 100%;
      padding: 15px;

      background: rgba(255,245,220,.95);

      border: 2px solid #b4772e;
      border-radius: 7px;

      color: #25170d;

      text-align: center;

      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;

      letter-spacing: 5px;
      text-transform: uppercase;

      outline: none;
    }

    #codigo:focus {
      border-color: #e3b35a;
      box-shadow: 0 0 12px rgba(224,157,55,.55);
    }

    button,
    .descargar {
      width: 100%;
      display: block;

      margin-top: 14px;
      padding: 15px 18px;

      border: 1px solid #e0a247;
      border-radius: 7px;

      background:
        linear-gradient(#a52b18, #67170e);

      color: #ffe5a7;

      font-family: Georgia, serif;
      font-size: 15px;
      font-weight: bold;

      letter-spacing: 1.5px;

      text-decoration: none;
      text-transform: uppercase;

      cursor: pointer;

      box-shadow:
        0 4px 10px rgba(0,0,0,.45);
    }

    button:hover,
    .descargar:hover {
      background:
        linear-gradient(#bd3921, #7d1c11);
    }

    #mensaje {
      min-height: 24px;
      margin-top: 15px;

      color: #e4ad62;

      font-size: 14px;
      line-height: 1.4;
    }

    #resultado {
      display: none;
      margin-top: 22px;
    }

    #foto {
      display: block;
      width: 100%;
      height: auto;

      border: 3px solid #a46d32;
      border-radius: 5px;

      box-shadow:
        0 7px 25px rgba(0,0,0,.65);
    }

    .nota {
      margin: 15px 0 0;
      color: #c9b48e;
      font-size: 12px;
      line-height: 1.4;
    }

    footer {
      margin-top: auto;
      padding-top: 45px;

      text-align: center;
    }

    .logo {
      display: block;

      width: 145px;
      max-width: 40vw;

      margin: 0 auto 8px;

      filter:
        drop-shadow(0 3px 6px rgba(0,0,0,.9));
    }

    .instagram {
      display: inline-block;

      color: #efca7c;
      text-decoration: none;

      font-family: Arial, sans-serif;
      font-size: 14px;

      text-shadow: 0 2px 4px #000;
    }

    .instagram:hover {
      text-decoration: underline;
    }

    .credito {
      margin-top: 7px;

      color: #aa9877;
      font-size: 11px;
    }

    @media (max-width: 600px) {

      body {
        background-attachment: scroll;
        background-position: center top;
      }

      .pagina {
        padding-top: 24px;
      }

      .cabecera {
        margin-bottom: 18px;
      }

      .tarjeta {
        padding: 23px 18px;
      }

      footer {
        padding-top: 35px;
      }
    }

  </style>
</head>


<body>

<div class="pagina">

  <header class="cabecera">

    <h1>Rialles<br>sense pietat</h1>

    <div class="subtitulo">
      Halloween 2026
    </div>

  </header>


  <main class="tarjeta">

    <h2>La teva fotografia t'espera...</h2>

    <p class="instruccion">
      Introdueix el codi que trobaràs al teu tiquet
      per veure i descarregar la fotografia.
    </p>


    <input
      id="codigo"
      type="text"
      maxlength="12"
      autocomplete="off"
      placeholder="CODI"
    >


    <button id="buscar">
      Veure la meva foto
    </button>


    <div id="mensaje"></div>


    <div id="resultado">

      <img
        id="foto"
        alt="Fotografia Halloween 2026"
      >

      <a
        id="descargar"
        class="descargar"
        href="#"
      >
        Descarregar fotografia
      </a>

      <p class="nota">
        L'enllaç de la fotografia és temporal i privat.
      </p>

    </div>

  </main>


  <footer>

    <img
      src="logo.png"
      class="logo"
      alt="Idria Foto"
    >

    <a
      class="instagram"
      href="https://www.instagram.com/idriafoto/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram · @idriafoto
    </a>

    <div class="credito">
      Fotografia · Idria Foto
    </div>

  </footer>

</div>


<script>

const FUNCION =
  "https://hssolvswalrmocnmaxhj.supabase.co/functions/v1/buscar-foto";


const boton = document.getElementById("buscar");
const campoCodigo = document.getElementById("codigo");
const mensaje = document.getElementById("mensaje");
const resultado = document.getElementById("resultado");
const foto = document.getElementById("foto");
const botonDescarga = document.getElementById("descargar");


async function buscarFoto() {

  const codigo =
    campoCodigo.value.trim().toUpperCase();

  resultado.style.display = "none";
  mensaje.textContent = "";


  if (!codigo) {

    mensaje.textContent =
      "Introdueix el codi del teu tiquet.";

    return;
  }


  boton.disabled = true;
  boton.textContent = "Buscant...";


  try {

    const respuesta = await fetch(FUNCION, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        codigo: codigo
      })

    });


    const datos = await respuesta.json();


    if (!respuesta.ok || !datos.url) {

      mensaje.textContent =
        "Codi incorrecte. Comprova que l'has escrit bé.";

      return;
    }


    foto.src = datos.url;

    resultado.style.display = "block";

    mensaje.textContent =
      "Fotografia trobada!";


    botonDescarga.onclick =
      async function(e) {

        e.preventDefault();

        botonDescarga.textContent =
          "Preparant descàrrega...";


        try {

          const respuestaFoto =
            await fetch(datos.url);

          const blob =
            await respuestaFoto.blob();

          const urlTemporal =
            URL.createObjectURL(blob);

          const enlace =
            document.createElement("a");

          enlace.href =
            urlTemporal;

          enlace.download =
            codigo + ".jpg";

          document.body.appendChild(enlace);

          enlace.click();

          enlace.remove();

          URL.revokeObjectURL(
            urlTemporal
          );

        }

        catch (error) {

          mensaje.textContent =
            "No s'ha pogut descarregar la fotografia.";

        }

        finally {

          botonDescarga.textContent =
            "Descarregar fotografia";

        }

      };


  }

  catch (error) {

    mensaje.textContent =
      "Hi ha hagut un problema de connexió. Torna-ho a provar.";

  }

  finally {

    boton.disabled = false;

    boton.textContent =
      "Veure la meva foto";

  }

}


boton.addEventListener(
  "click",
  buscarFoto
);


campoCodigo.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Enter") {
      buscarFoto();
    }

  }
);

</script>

</body>
</html>
